<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#30e8c9",
                        "background-light": "#f6f8f8",
                        "background-dark": "#11211e",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark overflow-x-hidden">
<div class="flex items-center p-4 pb-2 justify-between">
<button class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Income Setup</h2>
</div>
<div class="flex flex-col gap-3 p-6">
<div class="flex gap-6 justify-between items-end">
<p class="text-slate-900 dark:text-slate-100 text-base font-semibold leading-normal">Onboarding Progress</p>
<p class="text-slate-600 dark:text-slate-400 text-sm font-medium leading-normal">Step 2 of 5</p>
</div>
<div class="h-2 w-full rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
<div class="h-full bg-primary" style="width: 40%;"></div>
</div>
</div>
<div class="flex flex-col px-6 pt-4">
<h2 class="text-slate-900 dark:text-slate-100 tracking-tight text-3xl font-bold leading-tight pb-3">How much do you earn?</h2>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed">
                Enter your average take-home pay. This helps us create a personalized budget tailored to your needs.
            </p>
</div>
<div class="flex px-6 py-6">
<div class="flex h-12 w-full items-center justify-center rounded-xl bg-slate-200/50 dark:bg-slate-800/50 p-1.5">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-slate-700 has-[:checked]:shadow-sm has-[:checked]:text-primary text-slate-500 dark:text-slate-400 text-sm font-semibold transition-all">
<span class="truncate">Monthly</span>
<input checked="" class="hidden" name="income_period" type="radio" value="Monthly"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-slate-700 has-[:checked]:shadow-sm has-[:checked]:text-primary text-slate-500 dark:text-slate-400 text-sm font-semibold transition-all">
<span class="truncate">Weekly</span>
<input class="hidden" name="income_period" type="radio" value="Weekly"/>
</label>
</div>
</div>
<div class="flex flex-col px-6 gap-6">
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="text-slate-400 dark:text-slate-500 text-xl font-bold">$</span>
</div>
<input class="block w-full pl-10 pr-4 py-6 bg-white dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl text-4xl font-bold text-slate-900 dark:text-white focus:border-primary focus:ring-0 transition-all placeholder:text-slate-200 dark:placeholder:text-slate-700" placeholder="0.00" type="number"/>
</div>
<div class="flex flex-col gap-4 py-4">
<div class="flex items-center gap-3 p-4 rounded-xl bg-primary/10 border border-primary/20">
<span class="material-symbols-outlined text-primary">info</span>
<p class="text-sm text-slate-700 dark:text-slate-300">
                        Include all sources of regular income like salary, side hustles, or dividends.
                    </p>
</div>
</div>
</div>
<div class="mt-auto p-6 flex flex-col gap-4">
<button class="w-full bg-primary hover:bg-primary/90 text-slate-900 font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 group">
<span>Continue</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<button class="w-full text-slate-500 dark:text-slate-400 font-medium py-2 hover:text-slate-700 dark:hover:text-slate-200 transition-colors">
                I'll do this later
            </button>
</div>
<div class="h-8"></div>
</div>
</body></html>
