<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#30e8c9",
                        "background-light": "#f6f8f8",
                        "background-dark": "#11211e",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Mizan - Create Custom Goal</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full max-w-md mx-auto flex-col bg-white dark:bg-background-dark overflow-x-hidden">
<!-- Top Navigation -->
<div class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Create Custom Goal</h2>
</div>
<!-- Progress Indicator (Step 4 of 5) -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-5">
<div class="h-2 w-2 rounded-full bg-primary/30"></div>
<div class="h-2 w-2 rounded-full bg-primary/30"></div>
<div class="h-2 w-2 rounded-full bg-primary/30"></div>
<div class="h-2 w-8 rounded-full bg-primary"></div>
<div class="h-2 w-2 rounded-full bg-primary/30"></div>
</div>
<div class="px-6 py-4">
<h1 class="text-slate-900 dark:text-slate-100 text-[28px] font-bold leading-tight pb-6">What's the big dream?</h1>
<!-- Goal Name Input -->
<div class="flex flex-col gap-2 mb-6">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold">Goal Name</label>
<div class="relative">
<input class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 p-4 text-base focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-400" placeholder="e.g., New Keyboard, Graduation Trip" type="text"/>
</div>
</div>
<!-- Target Amount Input -->
<div class="flex flex-col gap-2 mb-8">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold">Target Amount</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-primary font-bold text-xl">$</span>
<input class="w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 py-4 pl-10 pr-4 text-xl font-bold focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-300" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Add a Photo Section -->
<div class="flex flex-col gap-2 mb-10">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold">Add a photo</label>
<div class="group relative flex aspect-video w-full cursor-pointer flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 hover:border-primary/50 hover:bg-primary/5 transition-all">
<div class="flex h-12 w-12 items-center justify-center rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-2xl">add_a_photo</span>
</div>
<p class="text-sm font-medium text-slate-500 dark:text-slate-400">Make it feel real</p>
</div>
</div>
<!-- Smart Tip -->
<div class="flex items-start gap-4 rounded-xl bg-primary/10 p-4 mb-8 border border-primary/20">
<div class="flex size-8 shrink-0 items-center justify-center rounded-full bg-primary text-white">
<span class="material-symbols-outlined text-sm">lightbulb</span>
</div>
<div class="flex flex-col gap-1">
<p class="text-xs font-bold uppercase tracking-wider text-primary">Smart Tip</p>
<p class="text-sm text-slate-700 dark:text-slate-300 leading-relaxed">
                        Visualizing your goal makes you <span class="font-bold text-primary">20% more likely</span> to stick to your plan.
                    </p>
</div>
</div>
</div>
<!-- Sticky Footer with Action Button -->
<div class="mt-auto p-6 bg-white dark:bg-background-dark border-t border-slate-100 dark:border-slate-800">
<button class="w-full bg-primary text-slate-900 font-bold py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Set Goal</span>
<span class="material-symbols-outlined text-lg">check_circle</span>
</button>
</div>
</div>
</body></html>
