<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",

</div>

</div>
<!-- Progress Bar -->

<div class="flex gap-6 justify-between items-center">

</div>
</div>

<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed mt-3">Pick a primary goal to help our AI calculate your opportunity costs and personalize your path.</p>
</div>

</div>
<div class="flex flex-col items-start">
<span class="material-symbols-outlined text-primary mb-1">laptop_mac</span>
<p class="text-white text-base font-bold leading-tight">New Laptop</p>

<div class="flex flex-col items-start">
<span class="material-symbols-outlined text-primary mb-1">beach_access</span>
<p class="text-white text-base font-bold leading-tight">Dream Trip</p>
</div>
</button>
<!-- Goal Card 3 -->
<button class="group relative bg-cover bg-center flex flex-col gap-3 rounded-xl justify-end p-4 aspect-square overflow-hidden ring-2 ring-transparent hover:ring-primary transition-all duration-300" data-alt="Stacks of coins with a small plant" style='background-image: linear-gradient(0deg, rgba(17, 33, 30, 0.9) 0%, rgba(17, 33, 30, 0) 60%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuCWs9AtdymmB2vvLgf7AAKJROxXi5QOYlkEvq1BsDR7tN-KtzCDp0MI27CRgIitl53HMZbFAC8r9kSmh7rgc4G11zUSCtsf5FmUkVclndUP302WjFaPcyW6fRoLOxHCbUqkw4Oeth5rAQc4DD7VGG8erYi1zDsrvtWmDXoSOj6-v9hL5vOkdlM47MuGai8hllcYrSIGrQrWZEyZZZG_WTcPMqBS_GxDiaa1D7yrsE18o1DPhNDYF05_gmqAxQf9bYlJeIAJSc0bFg");'>

</div>
</button>
<!-- Goal Card 4 -->
<button class="group relative bg-cover bg-center flex flex-col gap-3 rounded-xl justify-end p-4 aspect-square overflow-hidden ring-2 ring-transparent hover:ring-primary transition-all duration-300" data-alt="A modern house with green lawn" style='background-image: linear-gradient(0deg, rgba(17, 33, 30, 0.9) 0%, rgba(17, 33, 30, 0) 60%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuDsfoJm0mTHRJ1-0Lhm8dJnSSCvxseHgQ3_oJXdcdhzZyRvgsstUSiEbzZGT9UoA8xNtnawREDLBbaAevbvjMwiCVKGxyhbQoO8aAmwr6TaiRQYinVIbclX3yF2r6_giF2_b1kUQhPuDZm0OvxPKoIKDIUNymmSuY1zvsg-f84b9f3aFkxC6c1IAoirnihteGjoolbaubtoqJqjGHb0EqInLy4fVAWu_ew43awtVNJDanQjyS2lclm4BSYGrBpPymgL8Mvsw5pkow");'>

<span class="material-symbols-outlined text-primary mb-1">directions_car</span>
<p class="text-white text-base font-bold leading-tight">New Car</p>
</div>
</button>
<!-- Goal Card 6 (Custom) -->
<button class="group relative border-2 border-dashed border-slate-300 dark:border-slate-700 flex flex-col gap-3 rounded-xl justify-center items-center p-4 aspect-square hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<div class="flex flex-col items-center text-center">
<div class="size-12 rounded-full bg-primary/20 flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary">add_circle</span>
</div>
<p class="text-slate-900 dark:text-slate-100 text-base font-bold leading-tight">Custom Goal</p>
</div>
</button>
</div>
<!-- Bottom Action Bar -->
<div class="mt-auto p-6 pb-10 bg-gradient-to-t from-background-light dark:from-background-dark to-transparent">
<button class="w-full bg-primary hover:brightness-110 text-background-dark font-bold text-lg py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
                Continue
            </button>
<p class="text-slate-500 dark:text-slate-400 text-xs text-center mt-4 px-4 leading-relaxed">
                Choosing a goal now doesn't lock you in. You can change your focus at any time from your dashboard settings.
            </p>
</div>
<!-- Spacer for notch/gesture area -->
<div class="h-4 bg-background-light dark:bg-background-dark"></div>
</div>
</body></html>
